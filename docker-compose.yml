name: tunisian-admin-assistant

# Ollama runs natively on the host by default (uses the host GPU; avoids two Ollama instances
# competing for 4 GB of VRAM). Containers reach it via host.docker.internal.
# To run Ollama in Docker instead: `docker compose --profile ollama-docker up -d` and set
# OLLAMA_URL=http://ollama:11434 for the backend.

services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${QDRANT_HOST_PORT:-6343}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
    healthcheck:
      # The image ships without curl/wget; probe /readyz over bash's /dev/tcp.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q 200'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks: [internal]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    # Least privilege: only the variables the backend reads are passed (no Telegram token, no n8n key).
    # Defaults equal those of backend/settings.py; values come from .env through Compose interpolation.
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION_PREFIX: ${QDRANT_COLLECTION_PREFIX:-official_docs}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      LLM_MODEL: ${LLM_MODEL:-mistral:latest}
      HTTP_USER_AGENT: ${HTTP_USER_AGENT:-TunisianAdminAssistant-Research/0.1 (academic project)}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-60}
      MAX_DOWNLOAD_BYTES: ${MAX_DOWNLOAD_BYTES:-52428800}
      DEFAULT_CRAWL_DELAY_SECONDS: ${DEFAULT_CRAWL_DELAY_SECONDS:-2}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      # Privileged endpoints are disabled unless ADMIN_API_KEY is set; AGENT_API_KEY is optional (see
      # docs/SECURITY_DEPLOYMENT_GUIDE.md before enabling it: the n8n HTTP nodes must send X-Agent-Key).
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      AGENT_API_KEY: ${AGENT_API_KEY:-}
      DATA_DIR: /app/data
      SOURCES_REGISTRY: /app/config/sources.yaml
      EXTRA_CA_DIR: /app/config/certs
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: ${OLLAMA_URL_FOR_CONTAINERS:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./prompts:/app/prompts:ro  # prompt versions can be switched without rebuilding
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    depends_on:
      qdrant:
        condition: service_healthy
    networks: [internal]

  n8n:
    image: n8nio/n8n:2.41.3
    restart: unless-stopped
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Africa/Tunis}
      TZ: ${GENERIC_TIMEZONE:-Africa/Tunis}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:${N8N_HOST_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]

  # Telegram bot (Bot API long polling: no public URL or tunnel needed). Opt-in:
  #   docker compose --profile telegram up -d
  telegram-bridge:
    image: tunisian-admin-assistant-telegram
    build:
      context: .
      dockerfile: telegram_bridge/Dockerfile
    container_name: tunisian-admin-telegram-bridge
    stop_grace_period: 60s
    profiles: ["telegram"]
    restart: unless-stopped
    command: ["python", "-m", "telegram_bridge", "--wait-for-token"]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ASSISTANT_WEBHOOK_URL: http://n8n:5678/webhook/assistant
      # Optional: sent as X-Assistant-Key once Header Auth is enabled on the n8n assistant webhook.
      ASSISTANT_WEBHOOK_KEY: ${ASSISTANT_WEBHOOK_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib,time; p=pathlib.Path('/tmp/telegram-bridge-health'); exit(0 if p.exists() and time.time()-p.stat().st_mtime<1200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    depends_on:
      n8n:
        condition: service_healthy
    networks: [internal]

  ollama:
    image: ollama/ollama:0.40.4  # same version as the host install
    profiles: ["ollama-docker"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks: [internal]

volumes:
  qdrant_data:
  n8n_data:
  ollama_data:

networks:
  internal:
    driver: bridge
