# Official source registry.
#
# Rules:
#  - Only official Tunisian government sources. Domains must match `allowed_domains`.
#  - `title` is the title exactly as listed by the official website (link text, page <title>,
#    or the CMS media title). It is NOT invented.
#  - `language` / `publication_date` are set only after inspecting the original file.
#    Unknown values stay `unknown` / null. Never guess.
#  - `applicability` is `unverified` until a human confirms the document is still in force.
#  - status: approved   -> downloaded and processed by the ingestion pipeline
#            excluded   -> deliberately not ingested (see exclusion_reason)
#            not_found  -> a discovery candidate that could not be located on official sources
#
# Discovery performed: 2026-10-15.

allowed_domains:
  - home.registre-entreprises.tn
  - www.registre-entreprises.tn
  - services.interieur.gov.tn
  - www.interieur.gov.tn
  - www.iort.gov.tn

# robots.txt agents treated as "AI usage opt-out" signals. If a site disallows any of
# these for a path, the downloader refuses it even if our own user agent is allowed.
ai_optout_agents:
  - anthropic-ai
  - ClaudeBot
  - GPTBot
  - CCBot
  - Google-Extended

